# One-click deploy on Render (free plan):
#   https://render.com/deploy?repo=https://github.com/paraskatiyar91-svg/reachout
# Secrets marked `sync: false` are entered by you in the Render dashboard, never committed.
#
# NOTE: the free plan has no persistent disk, so set the two UPSTASH_* variables (free) and
# all data is kept in Upstash Redis (encrypted) and survives restarts and redeploys.
services:
  - type: web
    name: reachout
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    # disk:
    #   name: reachout-data
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      # - key: DATA_DIR        # uncomment together with the disk block
      #   value: /var/data
      - key: ENCRYPTION_KEY
        generateValue: true    # random 256-bit key, created once by Render
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Free persistent storage (https://console.upstash.com). Without these, data resets on restart.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: DAILY_SEND_LIMIT
        value: "40"
